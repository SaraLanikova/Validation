{{ extends "global/Page.html" }}
{{ block title }}{{ endblock }}

{{ block content }}
<div class="study-progress-wrap">
    <progress class="study-progress" id="sp-bar"></progress>
    <span class="study-progress-text" id="sp-text"></span>
</div>
<script>
    (function () {
        // Intro (first page) and End (last page) are not counted
        var current = {{ participant._index_in_pages }} - 2;
        var total = {{ participant._max_page_index }} - 3;
        var bar = document.getElementById('sp-bar');
        bar.max = total;
        bar.value = current;
        document.getElementById('sp-text').textContent = current + ' / ' + total;
    })();
</script>

<h4 style="text-align: center;"><b>Část 2: Doplňující otázky</b></h4>
<br>

{{ formfield 'lifespan' }}
{{ formfield 'kids' }}
{{ formfield 'language' }}

<button class="btn btn-primary otree-btn-next" style="padding: 10px 30px; font-size: 1.3em;">→</button>

{{ endblock }}
